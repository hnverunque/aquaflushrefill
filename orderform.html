<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Form | Aqua Flush Refill</title>
  <link rel="icon" href="aquarefill.png" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#DEF4FC] font-sans flex flex-col min-h-screen">

   <!-- Header -->
  <header class="bg-white shadow relative z-50">
  <div class="max-w-6xl mx-auto flex items-center justify-between p-4">
    <!-- Logo -->
    <div class="flex items-center space-x-2">
      <img src="aquarefill.png" alt="Logo" class="h-8 w-auto"/>
      <span class="font-bold text-gray-700">Aqua Flush Refill</span>
    </div>

    <!-- Mobile Toggle Button -->
    <button id="navToggle" class="md:hidden text-gray-700 text-2xl focus:outline-none">
      ☰
    </button>

    <!-- Desktop Menu -->
    <nav class="hidden md:flex space-x-4">
      <a href="index.html" class="text-gray-700 hover:text-blue-600">Home</a>
      <a href="orderform.html" class="text-blue-600 font-semibold">Order Now</a>
      <a href="transactions.html" class="text-gray-700 hover:text-blue-600">Transactions</a>
      <a href="analytics.html" class="text-gray-700 hover:text-blue-600">Analytics</a>
      <a href="about.html" class="text-gray-700 hover:text-blue-600">About Us</a>
      <a href="profile.html" class="text-gray-700 hover:text-blue-600">Profile</a>
      <a href="logout.html" class="text-red-700 hover:text-blue-600">Logout</a>
    </nav>
  </div>

  <!-- Floating Mobile Menu -->
  <div id="navMenu" class="fixed inset-0 bg-black bg-opacity-50 hidden">
    <div class="absolute top-0 right-0 w-64 h-full bg-white shadow-lg p-6 flex flex-col space-y-4">
      <button id="closeMenu" class="self-end text-gray-700 text-2xl">&times;</button>
      <a href="index.html" class="text-gray-700 hover:text-blue-600">Home</a>
      <a href="orderform.html" class="text-blue-600 font-semibold">Order Now</a>
      <a href="transactions.html" class="text-gray-700 hover:text-blue-600">Transactions</a>
      <a href="analytics.html" class="text-gray-700 hover:text-blue-600">Analytics</a>
      <a href="about.html" class="text-gray-700 hover:text-blue-600">About Us</a>
      <a href="profile.html" class="text-gray-700 hover:text-blue-600">Profile</a>
      <a href="logout.html" class="text-red-700 hover:text-blue-600">Logout</a>
    </div>
  </div>
</header>

  <!-- Order Form -->
  <main class="flex-grow">
    <div class="max-w-lg mx-auto mt-8 bg-white p-6 rounded-xl shadow">
      <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Water Order Form</h2>

      <form id="orderForm" class="space-y-4">
        <div>
          <label for="customerName" class="block font-semibold text-gray-700">Customer Name</label>
          <input type="text" id="customerName" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300"/>
        </div>

        <div>
          <label for="bottles" class="block font-semibold text-gray-700">Number of Bottles</label>
          <input type="number" id="bottles" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300"/>
        </div>

        <div>
          <label for="contactNumber" class="block font-semibold text-gray-700">Contact Number</label>
          <input type="text" id="contactNumber" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300"/>
        </div>

        <div>
          <label for="deliveryPreference" class="block font-semibold text-gray-700">Delivery Preference</label>
          <select id="deliveryPreference" onchange="toggleAddressField()" class="w-full border rounded-lg px-3 py-2">
            <option value="Pickup">Self-Pickup</option>
            <option value="Standard Delivery">Standard Delivery</option>
          </select>
        </div>

        <div id="deliveryAddress" class="hidden">
          <label for="customerAddress" class="block font-semibold text-gray-700">Delivery Address</label>
          <input type="text" id="customerAddress" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300"/>
        </div>

        <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg font-semibold hover:bg-blue-600">Submit Order</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white text-center text-sm p-6 mt-8">
    <p>©2024 UVW3. <strong>All rights reserved.</strong></p>
    <p><strong>Aqua Flush Refill System</strong> — educational project of Group 3, Section UVW.</p>
    <p class="mt-2" id="phTime"></p>
  </footer>

  <script>
 const navToggle = document.getElementById("navToggle");
  const navMenu = document.getElementById("navMenu");
  const closeMenu = document.getElementById("closeMenu");

  navToggle.addEventListener("click", () => {
  navMenu.classList.remove("hidden");
  });

  closeMenu.addEventListener("click", () => {
    navMenu.classList.add("hidden");
  });

  // Close when clicking outside menu
  navMenu.addEventListener("click", (e) => {
    if (e.target === navMenu) {
      navMenu.classList.add("hidden");
    }
  });

    // Toggle delivery address field
    function toggleAddressField() {
      const pref = document.getElementById("deliveryPreference").value;
      document.getElementById("deliveryAddress").classList.toggle("hidden", pref !== "Standard Delivery");
    }

    // Order form submission
    document.getElementById("orderForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const orderId = "AR-" + String(Math.floor(Math.random() * 9999)).padStart(4, "0");
      const orderDate = new Date().toLocaleString("en-US", { timeZone: "Asia/Manila" });

      const bottles = parseInt(document.getElementById("bottles").value);
      const deliveryPreference = document.getElementById("deliveryPreference").value;
      const bottleCost = deliveryPreference === "Pickup" ? 25 : 30;
      const totalCost = bottles * bottleCost;
      const loyaltyPoints = Math.floor(totalCost / 50);

      const order = {
        orderId,
        orderDate,
        customerName: document.getElementById("customerName").value,
        bottles,
        contactNumber: document.getElementById("contactNumber").value,
        deliveryPreference,
        customerAddress: document.getElementById("customerAddress").value,
        totalCost,
        loyaltyPoints,
        status: "Processing"
      };

      // Save to localStorage
      localStorage.setItem("latestOrder", JSON.stringify(order));

      // Save history
      const orders = JSON.parse(localStorage.getItem("orders")) || [];
      orders.push(order);
      localStorage.setItem("orders", JSON.stringify(orders));

      // Redirect to receipt page
      window.location.href = "receipt.html";
    });

    // PH time clock
    function updatePHTime() {
      const phTime = new Date().toLocaleString("en-US", { timeZone: "Asia/Manila" });
      document.getElementById("phTime").innerText = "Philippine Standard Time: " + phTime;
    }
    updatePHTime();
    setInterval(updatePHTime, 1000);
  </script>
</body>
</html>
