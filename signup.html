<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aqua Flush Refill - Sign Up</title>
  <link rel="icon" href="aquarefill.png" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">
    <img src="aquarefill.png" alt="Logo" class="w-24 mx-auto mb-4" />
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Create Account</h2>

    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-white"></div>

    <form id="signupForm" class="space-y-4">
      <div>
        <label class="block font-medium mb-1">Name</label>
        <input type="text" name="username" class="w-full border rounded-lg px-3 py-2 focus:ring focus:ring-blue-300" required />
      </div>

      <div>
        <label class="block font-medium mb-1">Email</label>
        <input type="email" name="email" class="w-full border rounded-lg px-3 py-2 focus:ring focus:ring-blue-300" required />
      </div>

      <div>
        <label class="block font-medium mb-1">Work Position</label>
        <input type="text" name="position" placeholder="e.g., Admin, Manager, Staff"
          class="w-full border rounded-lg px-3 py-2 focus:ring focus:ring-blue-300" required />
      </div>

      <div>
        <label class="block font-medium mb-1">Password</label>
        <input type="password" name="password" class="w-full border rounded-lg px-3 py-2 focus:ring focus:ring-blue-300" required />
      </div>

      <div>
        <label class="block font-medium mb-1">Confirm Password</label>
        <input type="password" name="confirmpass" class="w-full border rounded-lg px-3 py-2 focus:ring focus:ring-blue-300" required />
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
        Sign Up
      </button>
    </form>

    <p class="mt-4 text-center text-sm">
      Already have an account?
      <a href="login.html" class="text-blue-600 font-semibold hover:underline">Login</a>
    </p>
  </div>

  <script>
    const form = document.getElementById("signupForm");
    const alertBox = document.getElementById("alertBox");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const username = form.username.value.trim();
      const email = form.email.value.trim();
      const position = form.position.value.trim();
      const password = form.password.value;
      const confirmpass = form.confirmpass.value;

      if (password !== confirmpass) {
        showAlert("Passwords do not match", "bg-red-500");
        return;
      }

      const users = JSON.parse(localStorage.getItem("users")) || [];
      if (users.find(u => u.username === username)) {
        showAlert("User already exists", "bg-red-500");
        return;
      }

      users.push({ username, email, position, password });
      localStorage.setItem("users", JSON.stringify(users));
      showAlert("Account created! Redirecting to login...", "bg-green-600");

      setTimeout(() => window.location.href = "login.html", 1500);
    });

    function showAlert(message, color) {
      alertBox.textContent = message;
      alertBox.className = `${color} text-white p-3 rounded-lg mb-4 text-center`;
    }
  </script>
</body>
</html>
