<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logging Out...</title>
  <link rel="icon" href="aquarefill.png" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#DEF4FC] text-gray-800 flex items-center justify-center min-h-screen">

  <!-- Logout Message -->
  <div class="text-center">
    <img src="aquarefill.png" alt="Logo" class="h-16 mx-auto mb-4 animate-bounce">
    <h1 class="text-2xl font-bold text-gray-700 mb-2">Logging out...</h1>
    <p class="text-gray-600">You will be redirected shortly.</p>
  </div>

  <script>
    // Remove only the logged-in user session
    localStorage.removeItem("loggedInUser");

    // Redirect to login.html after 2 seconds
    setTimeout(() => {
      window.location.href = "login.html";
    }, 2000);
  </script>
</body>
</html>
